[pytest]
# pytest configuration for jiang-coal-automation

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    smoke: Smoke tests, run on every commit
    regression: Full regression tests
    web: Web UI tests
    mobile: Mobile H5 tests
    slow: Tests that take a long time to run
    flaky: Flaky tests that may need retry

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --capture=no
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml

# Timeout
timeout = 300
timeout_method = thread

# Retry flaky tests
reruns = 2
reruns_delay = 1

# Parallel execution (use: pytest -n auto)
# n = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Path configuration
pythonpath = .

# Encoding
console_output_style = progress
